<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" role="img" aria-label="Addis Eats">
  <!--
    The same device as the header mark: a solid ink square holding the drawn
    bowl glyph from the app's own icon set, on the same 24-unit grid with the
    same stroke weight. Colours are the computed sRGB for --ink-0 and --paper in
    the light scheme, because a favicon has no cascade and cannot resolve var().
  -->
  <rect width="32" height="32" fill="#10141a"/>
  <g transform="translate(4 4)" fill="none" stroke="#f8fafc" stroke-width="2" stroke-linecap="square" stroke-linejoin="miter">
    <path d="M3.4 11.2h17.2a8.6 8.6 0 0 1-17.2 0z"/>
    <path d="M8.6 7.6c0-1.8 1.4-2.3 1.4-3.8M14 7.6c0-1.8 1.4-2.3 1.4-3.8"/>
  </g>
</svg>
